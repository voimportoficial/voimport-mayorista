<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/favicon.PNG">

    <title>Producto | Vo Import</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body class="pagina-producto">


<header class="producto-detalle-header">
    <a
        href="catalogo.html"
        id="volver-marca"
    >
        ← Volver
    </a>
</header>

<main class="producto-detalle">

    <div class="producto-detalle-contenido">

        <div class="producto-detalle-imagen">

            <img
                id="producto-imagen"
                src=""
                alt=""
            >

        </div>

        <div class="producto-detalle-info">

            <p
                class="producto-marca"
                id="producto-marca"
            ></p>

            <h1 id="producto-nombre"></h1>

            <div
                class="producto-precios-detalle"
                id="producto-precios-detalle"
            ></div>

            <!-- Compatibilidad con la carga inicial/local -->
            <p class="detalle-precio minorista detalle-precio-legacy" id="precio-minorista"></p>
            <p class="detalle-precio mayorista detalle-precio-legacy" id="precio-mayorista"></p>
            <p class="condicion-mayorista detalle-precio-legacy" id="condicion-mayorista"></p>

            <div class="producto-descripcion">

                <h2>Descripción</h2>

                <p>
                    <strong>Presentación:</strong>
                    <span id="producto-presentacion"></span>
                </p>

                <p id="producto-descripcion"></p>

            </div>

            <div class="notas-olfativas">

                <h2>Notas olfativas</h2>

                <p>
                    <strong>Salida:</strong>
                    <span id="notas-salida"></span>
                </p>

                <p>
                    <strong>Corazón:</strong>
                    <span id="notas-corazon"></span>
                </p>

                <p>
                    <strong>Fondo:</strong>
                    <span id="notas-fondo"></span>
                </p>

            </div>

            <div
                class="producto-descripcion"
                id="bloque-inspiracion"
            >

                <h2>Inspiración</h2>

                <p id="producto-inspiracion"></p>

                <p id="producto-recomendacion"></p>

            </div>

            <div class="producto-compra">

                <label for="cantidad-producto">
                    Cantidad
                </label>

                <input
                    type="number"
                    id="cantidad-producto"
                    min="1"
                    value="1"
                >

                <button
                    type="button"
                    class="agregar-carrito"
                    id="agregar-producto"
                >
                    Agregar al carrito
                </button>

            </div>

        </div>

    </div>

</main>


<script src="js/productos.js"></script>

<script>

    const parametros =
        new URLSearchParams(window.location.search);

    const slug =
        parametros.get("slug");

    const producto =
        typeof productos !== "undefined" &&
        Array.isArray(productos)
            ? productos.find(
                (item) => item.id === slug
            )
            : null;


    function formatearPrecioLocal(precio) {

        return new Intl.NumberFormat(
            "es-AR",
            {
                style: "currency",
                currency: "ARS",
                maximumFractionDigits: 0
            }
        ).format(precio);

    }


    function obtenerPrecioListaDetalle(precioEfectivo) {
        const precio = Number(precioEfectivo || 0);
        return precio > 0 ? Math.round(precio / 0.8) : 0;
    }

    function iconoTarjetaDetalle() {
        return `
            <svg class="icono-tarjeta-precio" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="6" width="18" height="12" rx="2"></rect>
                <path d="M3 10h18"></path>
            </svg>
        `;
    }

    function renderizarPreciosDetalleLocal(producto) {
        const contenedor = document.getElementById("producto-precios-detalle");
        if (!contenedor || !producto) return;

        const precioLista = obtenerPrecioListaDetalle(producto.precioMinorista);
        const tieneMayorista = producto.categoria !== "decants";

        contenedor.innerHTML = tieneMayorista
            ? `
                <div class="detalle-precio-mayorista-principal">
                    <span class="detalle-mayorista-titulo">PRECIO MAYORISTA</span>
                    <small>Desde 3 perfumes surtidos</small>
                    <strong>${formatearPrecioLocal(producto.precioMayorista)}</strong>
                </div>

                <div class="detalle-precio-secundario detalle-precio-minorista">
                    <span class="detalle-precio-etiqueta">Minorista · 20% OFF efectivo / transferencia</span>
                    <strong>${formatearPrecioLocal(producto.precioMinorista)}</strong>
                </div>

                <div class="detalle-precio-secundario detalle-precio-tarjeta">
                    <span class="detalle-precio-etiqueta">
                        ${iconoTarjetaDetalle()}
                        Mercado Pago · 3 cuotas sin interés
                    </span>
                    <strong>${formatearPrecioLocal(precioLista)}</strong>
                </div>
            `
            : `
                <div class="detalle-precio-efectivo">
                    <span>20% OFF efectivo / transferencia</span>
                    <strong>${formatearPrecioLocal(producto.precioMinorista)}</strong>
                </div>

                <div class="detalle-precio-secundario detalle-precio-tarjeta">
                    <span class="detalle-precio-etiqueta">
                        ${iconoTarjetaDetalle()}
                        Mercado Pago · 3 cuotas sin interés
                    </span>
                    <strong>${formatearPrecioLocal(precioLista)}</strong>
                </div>
            `;
    }

    function crearSlugMarca(marca) {

        return marca
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .trim()
            .replace(/\s+/g, "-");

    }


    if (!producto) {

        /*
            Puede ser un producto creado desde Gestión que
            todavía no existe en productos.js. Dejamos la
            ficha intacta para que js/script.js lo cargue
            desde Supabase unos instantes después.
        */
        document.getElementById(
            "producto-nombre"
        ).textContent = "Cargando producto...";

    } else {

        document.title =
            `${producto.nombre} | Vo Import`;


        const volverMarca =
            document.getElementById("volver-marca");

       volverMarca.href = "catalogo.html";

volverMarca.textContent =
    "← Volver";


        const imagen =
            document.getElementById("producto-imagen");

        imagen.src =
            producto.imagen;

        imagen.alt =
            `Perfume ${producto.nombre}`;


        document.getElementById(
            "producto-marca"
        ).textContent =
            producto.marca;


        document.getElementById(
            "producto-nombre"
        ).textContent =
            producto.nombre;

        renderizarPreciosDetalleLocal(producto);


        document.getElementById(
            "precio-minorista"
        ).textContent =
            `Minorista: ${formatearPrecioLocal(
                producto.precioMinorista
            )}`;


        document.getElementById(
            "precio-mayorista"
        ).textContent =
            `Mayorista: ${formatearPrecioLocal(
                producto.precioMayorista
            )}`;


        document.getElementById(
            "producto-presentacion"
        ).textContent =
            producto.presentacion || "";


        document.getElementById(
            "producto-descripcion"
        ).textContent =
            producto.descripcion || "";


        document.getElementById(
            "notas-salida"
        ).textContent =
            producto.notasSalida || "";


        document.getElementById(
            "notas-corazon"
        ).textContent =
            producto.notasCorazon || "";


        document.getElementById(
            "notas-fondo"
        ).textContent =
            producto.notasFondo || "";


        document.getElementById(
            "producto-inspiracion"
        ).textContent =
            producto.inspiracion || "";


        document.getElementById(
            "producto-recomendacion"
        ).textContent =
            producto.recomendacion || "";


        const boton =
            document.getElementById(
                "agregar-producto"
            );


        boton.dataset.slug =
            producto.id;

        boton.dataset.nombre =
            producto.nombre;

        boton.dataset.categoria =
            producto.categoria;

        boton.dataset.precioMinorista =
            producto.precioMinorista;

        boton.dataset.precioMayorista =
            producto.precioMayorista;

        boton.dataset.imagen =
            producto.imagen;

        boton.dataset.stock =
            producto.stock ?? "";


        if (producto.categoria === "decants") {

            document.getElementById(
                "precio-minorista"
            ).textContent =
                `Precio: ${formatearPrecioLocal(
                    producto.precioMinorista
                )}`;

            document.getElementById(
                "precio-mayorista"
            ).style.display =
                "none";

            document.getElementById(
                "condicion-mayorista"
            ).style.display =
                "none";

        }

    }

</script>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/script.js"></script>

</body>

</html>
