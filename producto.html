<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/favicon.PNG">

    <title>Producto | Mireka Perfumería</title>

    <link rel="stylesheet" href="css/style.css">
    <!-- MIREKA | Distinciones del producto en su ficha grande -->
    <style>
      .pagina-producto .producto-detalle-imagen { position: relative; }
      .pagina-producto .mireka-detalle-etiquetas {
        position: absolute; top: 16px; right: 16px; z-index: 20;
        display: flex; flex-direction: column; align-items: flex-end;
        gap: 6px; max-width: calc(100% - 105px); pointer-events: none;
      }
      .pagina-producto .mireka-detalle-etiquetas:empty { display: none; }
      .pagina-producto .mireka-detalle-etiquetas span {
        display: inline-block; padding: 6px 10px;
        border: 1px solid rgba(224,185,100,.85); border-radius: 6px;
        background: rgba(12,12,12,.94); color: #e8c36b;
        font-size: 11px; line-height: 1.15; font-weight: 800;
        letter-spacing: .04em; text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,.25);
      }
      .pagina-producto .mireka-detalle-etiquetas .mireka-sale-tag {
        background: #cba552; color: #101010;
      }
      @media (max-width: 768px) {
        .pagina-producto .mireka-detalle-etiquetas {
          top: 12px; right: 12px; gap: 5px;
          max-width: calc(100% - 95px);
        }
        .pagina-producto .mireka-detalle-etiquetas span {
          font-size: 9px; padding: 5px 7px; letter-spacing: 0;
        }
      }
    </style>

</head>


<body class="pagina-producto">


<header class="producto-detalle-header">
    <a
        href="catalogo.html"
        id="volver-marca"
    >
        ← Volver
    </a>
</header>

<main class="producto-detalle">

    <div class="producto-detalle-contenido">

        <div class="producto-detalle-imagen">
            <!-- Etiquetas de colecciones; no reemplazan la cinta 20% OFF -->
            <div id="mireka-detalle-etiquetas" class="mireka-detalle-etiquetas" aria-label="Distinciones del producto"></div>

            <img
                id="producto-imagen"
                src=""
                alt=""
            >

        </div>

        <div class="producto-detalle-info">

            <p
                class="producto-marca"
                id="producto-marca"
            ></p>

            <h1 id="producto-nombre"></h1>

            <div
                class="producto-precios-detalle"
                id="producto-precios-detalle"
                aria-live="polite"
            ><p class="mireka-detalle-espera">Cargando precios...</p></div>

            <!-- Compatibilidad con la carga inicial/local -->
            <p class="detalle-precio minorista detalle-precio-legacy" id="precio-minorista"></p>
            <p class="detalle-precio mayorista detalle-precio-legacy" id="precio-mayorista"></p>
            <p class="condicion-mayorista detalle-precio-legacy" id="condicion-mayorista"></p>

            <div class="producto-descripcion">

                <h2>Descripción</h2>

                <p>
                    <strong>Presentación:</strong>
                    <span id="producto-presentacion"></span>
                </p>

                <p id="producto-descripcion"></p>

            </div>

            <div class="notas-olfativas">

                <h2>Notas olfativas</h2>

                <p>
                    <strong>Salida:</strong>
                    <span id="notas-salida"></span>
                </p>

                <p>
                    <strong>Corazón:</strong>
                    <span id="notas-corazon"></span>
                </p>

                <p>
                    <strong>Fondo:</strong>
                    <span id="notas-fondo"></span>
                </p>

            </div>

            <div
                class="producto-descripcion"
                id="bloque-inspiracion"
            >

                <h2>Inspiración</h2>

                <p id="producto-inspiracion"></p>

                <p id="producto-recomendacion"></p>

            </div>

            <div class="producto-compra">

                <label for="cantidad-producto">
                    Cantidad
                </label>

                <input
                    type="number"
                    id="cantidad-producto"
                    min="1"
                    value="1"
                >

                <button
                    type="button"
                    class="agregar-carrito"
                    id="agregar-producto"
                >
                    Agregar al carrito
                </button>

            </div>

        </div>

    </div>

</main>


<script src="js/productos.js"></script>

<script>

    const parametros =
        new URLSearchParams(window.location.search);

    const slug =
        parametros.get("slug");

    const producto =
        typeof productos !== "undefined" &&
        Array.isArray(productos)
            ? productos.find(
                (item) => item.id === slug
            )
            : null;


    function formatearPrecioLocal(precio) {

        return new Intl.NumberFormat(
            "es-AR",
            {
                style: "currency",
                currency: "ARS",
                maximumFractionDigits: 0
            }
        ).format(precio);

    }


    function crearSlugMarca(marca) {

        return marca
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .trim()
            .replace(/\s+/g, "-");

    }


    if (!producto) {

        /*
            Puede ser un producto creado desde Gestión que
            todavía no existe en productos.js. Dejamos la
            ficha intacta para que js/script.js lo cargue
            desde Supabase unos instantes después.
        */
        document.getElementById(
            "producto-nombre"
        ).textContent = "Cargando producto...";

    } else {

        document.title =
            `${producto.nombre} | Mireka Perfumería`;


        const volverMarca =
            document.getElementById("volver-marca");

       volverMarca.href = "catalogo.html";

volverMarca.textContent =
    "← Volver";


        const imagen =
            document.getElementById("producto-imagen");

        imagen.src =
            producto.imagen;

        imagen.alt =
            `Perfume ${producto.nombre}`;


        document.getElementById(
            "producto-marca"
        ).textContent =
            producto.marca;


        document.getElementById(
            "producto-nombre"
        ).textContent =
            producto.nombre;

        // Los precios se muestran al sincronizar las listas desde Supabase.
document.getElementById(
            "producto-presentacion"
        ).textContent =
            producto.presentacion || "";


        document.getElementById(
            "producto-descripcion"
        ).textContent =
            producto.descripcion || "";


        document.getElementById(
            "notas-salida"
        ).textContent =
            producto.notasSalida || "";


        document.getElementById(
            "notas-corazon"
        ).textContent =
            producto.notasCorazon || "";


        document.getElementById(
            "notas-fondo"
        ).textContent =
            producto.notasFondo || "";


        document.getElementById(
            "producto-inspiracion"
        ).textContent =
            producto.inspiracion || "";


        document.getElementById(
            "producto-recomendacion"
        ).textContent =
            producto.recomendacion || "";


        const boton =
            document.getElementById(
                "agregar-producto"
            );


        boton.dataset.slug =
            producto.id;

        boton.dataset.nombre =
            producto.nombre;

        boton.dataset.categoria =
            producto.categoria;

        boton.dataset.precioMinorista =
            producto.precioMinorista;

        boton.dataset.precioMayorista =
            producto.precioMayorista;

        boton.dataset.imagen =
            producto.imagen;

        boton.dataset.stock =
            producto.stock ?? "";




    }

</script>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/script.js"></script>

<!-- MIREKA | Usa los mismos estados de Supabase ya sincronizados por script.js. -->
<script>
(function () {
    "use strict";

    function actualizarEtiquetasDetalle() {
        const contenedor = document.getElementById("mireka-detalle-etiquetas");
        if (!contenedor) return;

        const slug = new URLSearchParams(window.location.search).get("slug") || "";
        const productoActual = typeof buscarProductoActual === "function"
            ? buscarProductoActual({ slug })
            : null;

        contenedor.replaceChildren();
        if (!productoActual) return;

        const etiquetas = [
            [productoActual.destacadoNuevo === true, "NUEVO", ""],
            [typeof mirekaOfertaVigente === "function"
                ? mirekaOfertaVigente(productoActual)
                : productoActual.destacadoOferta === true, "SALE", "mireka-sale-tag"],
            [productoActual.destacadoMasVendido === true, "MÁS VENDIDO", ""]
        ];

        for (const [visible, texto, clase] of etiquetas) {
            if (!visible) continue;
            const etiqueta = document.createElement("span");
            etiqueta.textContent = texto;
            if (clase) etiqueta.className = clase;
            contenedor.appendChild(etiqueta);
        }
    }

    // Mantiene etiquetas al cargar Supabase o al alternar minorista/mayorista.
    if (typeof actualizarFichaIndividual === "function") {
        const original = actualizarFichaIndividual;
        actualizarFichaIndividual = function (...args) {
            const resultado = original.apply(this, args);
            actualizarEtiquetasDetalle();
            return resultado;
        };
    }
    actualizarEtiquetasDetalle();
})();
</script>


</body>

</html>
