<meta charset="UTF-8">
<link rel="icon" type="image/png" href="images/favicon.PNG">
<title>Perfumes Armaf | Vo Import</title>

<link rel="stylesheet" href="css/style.css">

<body>

<header class="productos-header">
    <a href="/">← Volver al inicio</a>
    <h1 id="titulo-categoria">Categoría</h1>
</header>

<main>

    <section class="productos">
        <div class="container">


            <div
                class="productos-grid"
                id="productos-grid"
            ></div>

        </div>
    </section>

</main>

<button
    type="button"
    class="boton-carrito"
    id="abrir-carrito"
    aria-label="Abrir carrito"
>
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 3h2l2.2 10.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L20 7H7"></path>
        <circle cx="10" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
    </svg>

    <span id="contador-carrito">0</span>
</button>

<div
    class="carrito-overlay"
    id="carrito-overlay"
></div>

<aside
    class="carrito-panel"
    id="carrito-panel"
>

    <div class="carrito-encabezado">

        <h2>Mi carrito</h2>

        <button
            type="button"
            class="cerrar-carrito"
            id="cerrar-carrito"
            aria-label="Cerrar carrito"
        >
            ×
        </button>

    </div>

    <div
        class="carrito-productos"
        id="carrito-productos"
    >
        <p class="carrito-vacio">
            Tu carrito está vacío.
        </p>
    </div>

    <div class="carrito-resumen">

        <p id="mensaje-mayorista">
            Los mínimos mayoristas se calculan por categoría.
        </p>

        <div class="carrito-total">
            <span>Total</span>
            <strong id="carrito-total">$0</strong>
        </div>

        <button
            type="button"
            class="finalizar-pedido"
            id="finalizar-pedido"
        >
            Finalizar pedido
        </button>

    </div>

</aside>
<script>
    const parametros = new URLSearchParams(window.location.search);
    const categoria = parametros.get("categoria");

    const nombresCategorias = {
        "perfumes-grandes": "Perfumes árabes",
        "decants": "Decants 5 ml",
        "maison-30ml": "Maison Alhambra 30 ml",
        "inspiraciones": "Inspiraciones de diseñador"
    };

    if (categoria) {
        document.body.dataset.categoria = categoria;

        const nombreCategoria = nombresCategorias[categoria] || "Categoría";

        document.getElementById("titulo-categoria").textContent = nombreCategoria;
        document.title = `${nombreCategoria} | Vo Import`;
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/productos.js"></script>

<script>
    if (categoria === "decants") {
        for (let i = productos.length - 1; i >= 0; i--) {
            const producto = productos[i];

            if (
                producto.categoria === "decants" &&
                producto.linea === "inspiraciones"
            ) {
                productos.splice(i, 1);
            }
        }
    }
</script>

<script src="js/script.js"></script>

</body>
